version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      expo-and-react-native:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react*"
          - "@react-native*/*"
          - "@types/react*"
          - "jest-expo"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
