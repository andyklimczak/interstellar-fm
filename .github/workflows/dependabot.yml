name: Dependabot auto-merge

# Do not check out PR code or run PR scripts in this privileged job.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Approve and queue eligible updates behind required CI
        uses: andyklimczak/dependabot-auto-merge-action@5366b3363fcd27443f466fbd6d62abff6ca9d5a2 # v1.0.0
        with:
          token: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
          max-update-type: minor
          merge-method: squash
